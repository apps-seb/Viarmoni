<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Viarmoni - Panel Completo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #fdfaf9;
            --primary-gold: #c5a984;
            --text-dark: #4a4a4a;
            --danger: #b76e79;
        }
        body { font-family: "Montserrat", sans-serif; background: var(--bg-light); color: var(--text-dark); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Login */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px; margin-bottom: 15px; font-family: inherit; }
        button { background: var(--primary-gold); color: white; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { filter: brightness(0.9); }
        .delete-btn { background: var(--danger); width: auto; font-size: 0.8rem; padding: 5px 10px; }

        /* Dashboard */
        #dashboard { display: none; }
        .section-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border-top: 5px solid var(--primary-gold); }
        h2 { margin-top: 0; color: var(--primary-gold); }
        .item-list { display: grid; gap: 10px; margin-top: 15px; }
        .item { border: 1px solid #eee; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .loader { display: none; color: var(--primary-gold); text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Acceso Administrativo</h2>
        <input type="email" id="email" placeholder="Correo electrónico (admin@viarmoni.com)">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="login-btn">Ingresar</button>
        <p id="login-error" style="color: var(--danger); margin-top: 10px;"></p>
    </div>

    <div id="dashboard" class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Panel de Control</h1>
            <button onclick="logout()" style="width: auto; background: #333;">Salir</button>
        </div>

        <div class="section-card">
            <h2>Editar Información de Cuidados</h2>
            <p style="font-size: 0.9rem; margin-bottom: 15px;">Edita los textos que aparecen en los modales de la app.</p>
            
            <label><strong>1. Instrucciones Generales</strong></label>
            <textarea id="text-instructions" rows="4"></textarea>
            <button onclick="updateCareText('instructions', 'text-instructions')">Guardar Instrucciones</button>
            <br><br>

            <label><strong>2. Cuidados Previos</strong></label>
            <textarea id="text-pre" rows="4"></textarea>
            <button onclick="updateCareText('pre_op', 'text-pre')">Guardar Previos</button>
            <br><br>

            <label><strong>3. Cuidados Post-Operatorios</strong></label>
            <textarea id="text-post" rows="4"></textarea>
            <button onclick="updateCareText('post_op', 'text-post')">Guardar Post</button>
        </div>

        <div class="section-card">
            <h2>Crear Jornada de Valoración</h2>
            <form id="journey-form">
                <label>Ciudad</label>
                <input type="text" id="journey-city" placeholder="Ej: Medellín" required>
                
                <label>Procedimiento Principal (Etiqueta)</label>
                <select id="journey-procedure" required>
                    <option value="Valoración General">Valoración General</option>
                    <option value="Lipopapada">Lipopapada</option>
                    <option value="Bichectomía">Bichectomía</option>
                    <option value="Rinomodelación">Rinomodelación</option>
                    <option value="Labios">Aumento de Labios</option>
                    <option value="Full Face">Full Face (Armonización Completa)</option>
                </select>

                <label>Fechas</label>
                <input type="text" id="journey-date" placeholder="Ej: 20 y 21 de Enero" required>
                
                <label>Descripción</label>
                <textarea id="journey-desc" rows="3" placeholder="Ej: Cupos limitados en zona El Poblado..." required></textarea>
                
                <button type="submit">Publicar Jornada</button>
            </form>
            <h3>Jornadas Activas</h3>
            <div id="journey-list" class="item-list"></div>
        </div>

        <div class="section-card">
            <h2>Subir Transformación (Galería)</h2>
            <form id="gallery-form">
                <input type="text" id="gallery-title" placeholder="Título (Ej: Rinomodelación)" required>
                <select id="gallery-category" required>
                    <option value="Rinomodelación">Rinomodelación</option>
                    <option value="Labios">Labios</option>
                    <option value="Lipopapada">Lipopapada</option>
                    <option value="Bichectomía">Bichectomía</option>
                    <option value="Otros">Otros</option>
                </select>
                <label>Foto ANTES</label>
                <input type="file" id="file-before" accept="image/*" required>
                <label>Foto DESPUÉS</label>
                <input type="file" id="file-after" accept="image/*" required>
                <div id="gallery-loader" class="loader">Subiendo...</div>
                <button type="submit">Publicar Foto</button>
            </form>
            <h3>Galería Activa</h3>
            <div id="gallery-list" class="item-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBkcFFE_E-GzSVVUdfCew4fscnV6PHkH0I",
            authDomain: "viarmoni.firebaseapp.com",
            projectId: "viarmoni",
            storageBucket: "viarmoni.firebasestorage.app",
            messagingSenderId: "765794389868",
            appId: "1:765794389868:web:d7bedf9297d0458e616d49"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- AUTH ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadJourneys();
                loadGallery();
                loadCareTexts();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard').style.display = 'none';
            }
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
            .catch(e => document.getElementById('login-error').innerText = e.message);
        });
        window.logout = () => signOut(auth);

        // --- 1. CUIDADOS (TEXTOS) ---
        async function loadCareTexts() {
            const docs = ['instructions', 'pre_op', 'post_op'];
            const inputs = ['text-instructions', 'text-pre', 'text-post'];
            
            for(let i=0; i<docs.length; i++) {
                const snap = await getDoc(doc(db, "care_info", docs[i]));
                if(snap.exists()) document.getElementById(inputs[i]).value = snap.data().content || "";
            }
        }

        window.updateCareText = async (docId, inputId) => {
            const content = document.getElementById(inputId).value;
            try {
                await setDoc(doc(db, "care_info", docId), { content });
                alert("Texto actualizado correctamente.");
            } catch(e) { alert("Error: " + e.message); }
        }

        // --- 2. JORNADAS ---
        document.getElementById('journey-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const city = document.getElementById('journey-city').value;
            const procedure = document.getElementById('journey-procedure').value; // NUEVO
            const dateText = document.getElementById('journey-date').value;
            const desc = document.getElementById('journey-desc').value;

            try {
                await addDoc(collection(db, "journeys"), { city, procedure, dateText, desc, timestamp: Date.now() });
                e.target.reset();
                alert("Jornada creada");
            } catch(e) { alert(e.message); }
        });

        function loadJourneys() {
            onSnapshot(query(collection(db, "journeys"), orderBy("timestamp", "desc")), (snap) => {
                const div = document.getElementById('journey-list');
                div.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    const item = document.createElement('div');
                    item.className = "item";
                    item.innerHTML = `<div><strong>${data.city}</strong> (${data.procedure})<br><small>${data.dateText}</small></div><button class="delete-btn" onclick="del('journeys','${d.id}')">X</button>`;
                    div.appendChild(item);
                });
            });
        }

        // --- 3. GALERÍA ---
        document.getElementById('gallery-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('gallery-loader').style.display = 'block';
            const title = document.getElementById('gallery-title').value;
            const category = document.getElementById('gallery-category').value;
            const f1 = document.getElementById('file-before').files[0];
            const f2 = document.getElementById('file-after').files[0];

            try {
                const u1 = await getDownloadURL((await uploadBytes(ref(storage, `gallery/${Date.now()}_b`), f1)).ref);
                const u2 = await getDownloadURL((await uploadBytes(ref(storage, `gallery/${Date.now()}_a`), f2)).ref);
                await addDoc(collection(db, "gallery"), { title, category, beforeUrl: u1, afterUrl: u2, timestamp: Date.now() });
                e.target.reset();
                alert("Foto subida");
            } catch(e) { alert(e.message); }
            document.getElementById('gallery-loader').style.display = 'none';
        });

        function loadGallery() {
            onSnapshot(query(collection(db, "gallery"), orderBy("timestamp", "desc")), (snap) => {
                const div = document.getElementById('gallery-list');
                div.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    const item = document.createElement('div');
                    item.className = "item";
                    item.innerHTML = `<div style="display:flex;align-items:center"><img src="${data.beforeUrl}" style="width:40px;height:40px;margin-right:10px;object-fit:cover"><b>${data.title}</b></div><button class="delete-btn" onclick="del('gallery','${d.id}')">X</button>`;
                    div.appendChild(item);
                });
            });
        }

        window.del = async (col, id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, col, id)); }
    </script>
</body>
</html>
