<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Viarmoni</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>

    <style>
        :root {
            --white: #ffffff;
            --bg-light: #fdfaf9;
            --text-dark: #4a4a4a;
            --primary-gold: #c5a984;
            --secondary-rose: #e0c0c3;
            --accent-dark: #a1886b;
            --danger: #b76e79;
            --success: #6ba18b;
            --font-main: "Montserrat", sans-serif;
            --shadow-light: 0 4px 15px rgba(0, 0, 0, 0.06);
            --border-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, var(--bg-light), var(--secondary-rose));
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .digital-card {
            background: var(--bg-light);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            text-align: center;
            padding: 10px 20px;
            background: var(--white);
            border-bottom: 1px solid rgba(197, 169, 132, 0.2);
            position: relative;
            flex-shrink: 0;
        }

        .logo {
            max-width: 140px;
            height: auto;
        }

        /* Hero Carousel (Slider) */
        .hero-slider {
            width: 100%;
            flex-grow: 1;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        .splide {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .splide__track {
            flex-grow: 1;
        }

        .splide__list {
            height: 100%;
        }

        .splide__slide {
            height: 100%;
        }

        .splide__slide img, .splide__slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .splide__pagination {
            bottom: 10px;
        }

        .splide__pagination__page.is-active {
            background: var(--primary-gold);
        }

        .card-body {
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .card-title {
            color: var(--danger);
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-subtitle {
            color: var(--text-dark);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        /* Botones Profesionales */
        .link-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--white);
            color: var(--text-dark);
            padding: 12px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(197, 169, 132, 0.4);
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .btn-link i {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .btn-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(197, 169, 132, 0.2);
            border-color: var(--primary-gold);
        }

        .btn-link:hover i {
            transform: scale(1.1);
        }

        /* Colores específicos de íconos en hover (opcional, para toque profesional) */
        .btn-website i { color: var(--accent-dark); }
        .btn-whatsapp i { color: #25D366; }
        .btn-instagram i { color: #E1306C; }
        .btn-facebook i { color: #1877F2; }

        .btn-link:hover.btn-whatsapp { border-color: #25D366; }
        .btn-link:hover.btn-instagram { border-color: #E1306C; }
        .btn-link:hover.btn-facebook { border-color: #1877F2; }
        .btn-link:hover.btn-maps { border-color: #EA4335; }

        .btn-maps {
            grid-column: span 2;
        }
        .btn-maps i { color: #EA4335; }

    </style>
</head>
<body>

    <div class="digital-card">
        <div class="card-header">
            <img src="https://mercacol.com.co/wp-content/uploads/2026/04/logo.webp" alt="Viarmoni Logo" class="logo">
        </div>

        <section class="splide hero-slider" id="contact-carousel">
            <div class="splide__track">
                <ul class="splide__list">
                    <!-- Sliders (Placeholder images/videos can be replaced later) -->
                    <li class="splide__slide">
                        <img src="https://placehold.co/600x600/e0c0c3/ffffff?text=Viarmoni" alt="Imagen 1">
                    </li>
                    <li class="splide__slide">
                        <img src="https://placehold.co/600x600/c5a984/ffffff?text=Armonizacion" alt="Imagen 2">
                    </li>
                    <li class="splide__slide">
                        <img src="https://placehold.co/600x600/b76e79/ffffff?text=Belleza" alt="Imagen 3">
                    </li>
                </ul>
            </div>
        </section>

        <div class="card-body">
            <h1 class="card-title">Contáctanos</h1>
            <p class="card-subtitle">Conecta con nosotros</p>

            <div class="link-buttons">
                <a href="https://www.viarmoni.com" target="_blank" class="btn-link btn-website">
                    <i class="fas fa-globe"></i> Sitio Web
                </a>
                <a href="https://wa.me/573054255782" target="_blank" class="btn-link btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a href="https://www.instagram.com/viarmoni?igsh=MWVhcmQ4c2hwdDdqdQ==" target="_blank" class="btn-link btn-instagram">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
                <a href="https://www.facebook.com/share/18nrjcfZkU/?mibextid=wwXIfr" target="_blank" class="btn-link btn-facebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </a>
                <a href="https://maps.app.goo.gl/pJfpLvBL2g6DKWXBA" target="_blank" class="btn-link btn-maps">
                    <i class="fas fa-map-marker-alt"></i> Visítanos
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new Splide('#contact-carousel', {
                type: 'loop',
                autoplay: true,
                interval: 3000,
                arrows: false,
                pagination: true,
                pauseOnHover: false
            }).mount();
        });
    </script>
</body>
</html>
